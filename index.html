  <meta name="description" content="自动生成绿脉环保协会晚安文案，含农历干支与两地明日天气。">
  <title>绿脉晚安生成器</title>

    :root{--ink:#16352d;--muted:#60736c;--green:#176b51;--green2:#0e513d;--leaf:#dff2e8;--paper:#f7fbf8;--line:#d5e4dc;--white:#fff;--shadow:0 18px 55px rgba(25,75,59,.12)}

    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 12% 15%,rgba(23,107,81,.1) 0 2px,transparent 3px),radial-gradient(circle at 85% 80%,rgba(23,107,81,.08) 0 2px,transparent 3px);background-size:44px 44px,62px 62px}
    .shell{position:relative;max-width:1220px;margin:auto;padding:32px 22px 48px}.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}.mark{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 9px 25px rgba(23,107,81,.2)}.mark img{width:100%;height:100%;object-fit:cover;display:block}h1{font-size:clamp(25px,4vw,36px);line-height:1.15;margin:0}.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:minmax(310px,.9fr) minmax(360px,1.1fr);gap:22px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(213,228,220,.9);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:23px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card-head h2{margin:0;font-size:19px}.status{font-size:13px;color:var(--muted);background:#eef4f1;border-radius:999px;padding:5px 10px}.status.loading{color:#835d0b;background:#fff3cd}.status.done{color:#0c6a45;background:#dff5e9}.status.error{color:#9e2d2d;background:#ffe5e5}
    label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}.field{margin-bottom:16px}input,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;color:var(--ink);font:inherit;outline:none;transition:.2s}input:focus,textarea:focus{border-color:#65a98d;box-shadow:0 0 0 3px rgba(43,132,96,.12);background:#fff}textarea{resize:vertical;min-height:116px}.mini{color:var(--muted);font-size:12px;margin-top:5px}.fixed{display:grid;grid-template-columns:1fr 1fr;gap:10px}.place{background:var(--leaf);border-radius:12px;padding:10px 12px;font-size:14px}.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:4px}button{border:0;border-radius:12px;padding:12px 17px;font:700 15px inherit;cursor:pointer;transition:.18s}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green2);transform:translateY(-1px)}.primary:disabled{opacity:.55;cursor:wait;transform:none}.secondary{background:#e8f1ed;color:var(--green2)}
    .preview{min-height:680px;background:#fcfefd}.output{white-space:pre-wrap;word-break:break-word;margin:0;padding:25px;font:16px/1.72 ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;color:#183b31}.empty{height:600px;display:grid;place-items:center;text-align:center;color:#80938c;padding:30px}.empty b{display:block;color:#466159;font-size:17px;margin-bottom:4px}.notice{display:none;margin:0 23px 18px;padding:10px 12px;border-radius:10px;background:#fff1f1;color:#922b2b;font-size:13px}.notice.show{display:block}
    @media(max-width:700px){.shell{padding:22px 14px 35px}.grid{grid-template-columns:1fr}.preview{min-height:400px}.empty{height:330px}.fixed{grid-template-columns:1fr}.card{border-radius:18px}.pad{padding:18px}.output{padding:20px;font-size:15px}.actions{position:sticky;bottom:8px;background:rgba(255,255,255,.9);padding:8px;margin:0 -8px -8px;backdrop-filter:blur(10px)}}
    @media(min-width:701px) and (max-width:900px){.shell{padding-left:14px;padding-right:14px}.grid{grid-template-columns:minmax(300px,42%) minmax(0,58%);gap:14px}.pad{padding:18px}.output{padding:18px;font-size:14px}.fixed{grid-template-columns:1fr}.preview{min-height:680px}}
  </style>

<script>
const $=id=>document.getElementById(id), SEP='————————————';let generatedFor='';
const defaults={start:'2026-09-13',copy:'大海从鱼跃，\n长空任鸟飞。\n欲知吾道廓，\n不与物情违。\n——阮阅',eco:'温室气体主要包含二氧化碳、甲烷、氧化亚氮，是全球变暖的主要诱因。',editors:'荔枝 白杨'};
const places=[{name:'北京海淀',lat:39.96,lon:116.30},{name:'山东烟台',lat:37.46,lon:121.45}];
function cnDay(n){const nums=['一','二','三','四','五','六','七','八','九','十'];if(n<=10)return '初'+nums[n-1];if(n<20)return '十'+nums[n-11];if(n===20)return '二十';if(n<30)return '廿'+nums[n-21];return '三十'}
function chinaDate(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
function dateFrom(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function weekdayOf(s){const [y,m,d]=s.split('-').map(Number);return '星期'+'日一二三四五六'[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}
function lunarInfo(s){const d=dateFrom(s), p=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Shanghai'}).formatToParts(d),o=Object.fromEntries(p.map(x=>[x.type,x.value]));const yg=o.yearName, stems='甲乙丙丁戊己庚辛壬癸',branches='子丑寅卯辰巳午未申酉戌亥',zodiacs='鼠牛虎兔龙蛇马羊猴鸡狗猪',monthChars='正二三四五六七八九十冬腊';const lunarMonth=monthChars.indexOf(o.month.replace('闰','').replace('月',''))+1;if(lunarMonth<1)throw Error('农历月份解析失败');const monthStemStart=[2,4,6,8,0][stems.indexOf(yg[0])%5],mg=stems[(monthStemStart+lunarMonth-1)%10]+branches[(lunarMonth+1)%12];const base=Date.UTC(2000,0,7),days=Math.round((d-base)/86400000),dg=stems[((days%60)+60)%60%10]+branches[((days%60)+60)%60%12];return `${yg}[${zodiacs[branches.indexOf(yg[1])]}]年${mg}月${dg}日${o.month}${cnDay(Number(o.day))}`}
function weatherName(c){if(c===0)return'晴';if(c<=3)return'多云';if(c===45||c===48)return'雾';if(c>=51&&c<=67)return'雨';if(c>=71&&c<=77)return'雪';if(c>=80&&c<=82)return'阵雨';if(c>=85&&c<=86)return'阵雪';if(c>=95)return'雷雨';return'多云'}
function windLevel(kmh){const ms=kmh/3.6,limits=[.3,1.6,3.4,5.5,8,10.8,13.9,17.2,20.8,24.5,28.5,32.7];for(let i=0;i<limits.length;i++)if(ms<limits[i])return i;return 12}
function airName(a){if(a<=50)return'优';if(a<=100)return'良';if(a<=150)return'轻度污染';if(a<=200)return'中度污染';if(a<=300)return'重度污染';return'严重污染'}
function hm(v){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'numeric',minute:'2-digit',hour12:false}).format(new Date(v))}
async function getWeather(p,target,signal){const w=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,wind_speed_10m_max&timezone=Asia%2FShanghai&start_date=${target}&end_date=${target}`;const a=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&hourly=us_aqi&timezone=Asia%2FShanghai&start_date=${target}&end_date=${target}`;const [wr,ar]=await Promise.all([fetch(w,{signal}),fetch(a,{signal})]);if(!wr.ok||!ar.ok)throw Error('天气服务暂时不可用');const [wd,ad]=await Promise.all([wr.json(),ar.json()]);const vals=(ad.hourly?.us_aqi||[]).filter(Number.isFinite),aq=vals.length?Math.round(Math.max(...vals)):null;if(!wd.daily?.time?.length)throw Error('未取得明日天气');return{name:p.name,weather:weatherName(wd.daily.weather_code[0]),low:Math.round(wd.daily.temperature_2m_min[0]),high:Math.round(wd.daily.temperature_2m_max[0]),wind:windLevel(wd.daily.wind_speed_10m_max[0]),air:aq==null?'暂无数据':airName(aq),sunrise:hm(wd.daily.sunrise[0]),sunset:hm(wd.daily.sunset[0])}}
function save(){localStorage.setItem('green-goodnight',JSON.stringify({start:$('start').value,copy:$('copy').value,eco:$('eco').value,editors:$('editors').value}))}function load(){try{Object.assign(defaults,JSON.parse(localStorage.getItem('green-goodnight'))||{})}catch{}for(const k of Object.keys(defaults))$(k).value=defaults[k]}
function setStatus(text,type=''){$('status').textContent=text;$('status').className='status '+type}
function clearStaleResult(){if(generatedFor&&generatedFor!==chinaDate()){generatedFor='';$('output').textContent='';$('output').hidden=true;$('copybar').hidden=true;$('empty').hidden=false;setStatus('未生成')}}
async function generate(){const start=$('start').value;if(!start)return $('start').focus();const today=chinaDate();if(today<start){$('notice').textContent='今天早于设置的第一天，请检查日期。';$('notice').classList.add('show');return}save();setStatus('生成中','loading');$('generate').disabled=true;$('notice').classList.remove('show');const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{const td=dateFrom(today),tomorrow=new Date(td.getTime()+86400000).toISOString().slice(0,10),weather=await Promise.all(places.map(p=>getWeather(p,tomorrow,ctrl.signal)));const n=Math.floor((dateFrom(today)-dateFrom(start))/86400000)+1,week=weekdayOf(today),dateLine=`${td.getUTCFullYear()}年${td.getUTCMonth()+1}月${td.getUTCDate()}日 ${week}`,block=weather.map(x=>`【${x.name}】\n天气：${x.weather}\n温度：${x.low}-${x.high}℃\n风：${x.wind}级\n空气质量：${x.air}\n日出清晨：${x.sunrise}\n日落傍晚：${x.sunset}`).join('\n');$('output').textContent=`绿脉环保协会 跟你说晚安\n第${n}天\n${SEP}\n${dateLine}\n农历 ${lunarInfo(today)}\n明日预报\n${block}\n${SEP}\n${$('copy').value.trim()}\n${SEP}\n环享栏目\n${$('eco').value.trim()}\n${SEP}\n欢迎投稿\n晚安\n（编辑：${$('editors').value.trim()}）`;generatedFor=today;$('empty').hidden=true;$('output').hidden=false;$('copybar').hidden=false;setStatus('已生成','done')}catch(e){setStatus('生成失败','error');$('notice').textContent=e.name==='AbortError'?'天气获取超时，请检查网络后重试。':(e.message==='农历月份解析失败'?'农历月份计算失败，请刷新后重试。':'未能获取准确天气，请稍后重试；本次未生成，以免使用错误数据。');$('notice').classList.add('show')}finally{clearTimeout(timer);$('generate').disabled=false}}
$('generate').onclick=generate;$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('output').textContent);$('copyBtn').textContent='已复制';setTimeout(()=>$('copyBtn').textContent='复制全部文案',1300)};$('reset').onclick=()=>{localStorage.removeItem('green-goodnight');Object.assign(defaults,{start:'2026-09-13',copy:'大海从鱼跃，\n长空任鸟飞。\n欲知吾道廓，\n不与物情违。\n——阮阅',eco:'温室气体主要包含二氧化碳、甲烷、氧化亚氮，是全球变暖的主要诱因。',editors:'荔枝 白杨'});load()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)clearStaleResult()});setInterval(clearStaleResult,60000);load();
</script>
